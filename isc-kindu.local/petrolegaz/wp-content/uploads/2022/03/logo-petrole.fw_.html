<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page non trouvée</title>
  <style>
    :root { --bg:#0b132b; --card:#0f1b33; --accent:#f15025; --muted:#cbd5e1; --text:#e2e8f0; --shadow:0 18px 50px rgba(0,0,0,0.35); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 20% 20%, rgba(255,255,255,0.02), transparent 25%), radial-gradient(circle at 80% 0%, rgba(255,255,255,0.03), transparent 30%), var(--bg); color:var(--text); font-family:'Inter','Montserrat',system-ui,sans-serif; padding:22px; }
    .card { max-width: 520px; width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,0.06); box-shadow: var(--shadow); border-radius: 14px; padding: 26px 28px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
    .badge { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; background:rgba(241,80,37,0.14); color:#ffd7c2; border-radius:999px; font-weight:700; border:1px solid rgba(241,80,37,0.35); }
    a.btn { display:inline-flex; align-items:center; gap:8px; padding:12px 14px; background:var(--accent); color:#0b132b; text-decoration:none; font-weight:700; border-radius:10px; border:1px solid rgba(0,0,0,0.08); box-shadow:0 12px 30px rgba(0,0,0,0.25); }
    a.btn:hover { filter: brightness(1.05); }
    .small { font-size: 13px; color: rgba(255,255,255,0.65); }
    footer { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,0.7); text-align: center; }
  </style>
</head>
<body>
  <div class="card" role="alert">
    <div class="badge">ISC KINDU</div>
    <h1>Page non trouvée</h1>
    <p>Texte de d&eacute;monstration &agrave; remplacer.</p>
    <a class="btn" href="/">Retour à l’accueil</a>
    <p class="small">Texte de d&eacute;monstration &agrave; remplacer.</p>
  </div>
  <footer>Refonte PHP – Maquette de prévisualisation. Les données sont indicatives.</footer>
</body>
</html>
