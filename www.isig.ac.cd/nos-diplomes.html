<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos diplomes - ISC-KINDU</title>
    <meta name="description" content="Liste des diplomes de l'ISC Kindu.">
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="css/public-theme.css?v=20260813">
    <style>
        body { margin: 0; background: #f8fafc; color: #0f172a; font-family: Inter, system-ui, sans-serif; }
        .clean-header { background: #fff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50; }
        .clean-container { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
        .clean-nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .clean-brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 800; letter-spacing: .02em; }
        .clean-brand img { width: 48px; height: 48px; object-fit: contain; border-radius: 6px; }
        .clean-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px 18px; font-size: 14px; }
        .clean-links a { color: #334155; text-decoration: none; font-weight: 600; }
        .clean-links a:hover { color: #0369a1; }
        .clean-main { padding: 72px 0 84px; }
        .clean-kicker { color: #0369a1; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .clean-title { margin: 14px 0 12px; font-size: clamp(36px, 6vw, 68px); line-height: .95; letter-spacing: 0; }
        .clean-lede { max-width: 680px; color: #475569; font-size: 18px; line-height: 1.7; }
        .clean-empty { margin-top: 36px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .clean-card { min-height: 170px; border: 1px dashed #94a3b8; border-radius: 8px; background: #fff; }
        .clean-note { margin-top: 18px; color: #64748b; font-size: 14px; }
        .clean-footer { border-top: 1px solid #e2e8f0; background: #0f172a; color: #cbd5e1; padding: 28px 0; font-size: 14px; }
        .clean-footer a { color: #fff; text-decoration: none; }
        @media (max-width: 760px) { .clean-nav { align-items: flex-start; flex-direction: column; padding: 14px 0; } .clean-links { justify-content: flex-start; } .clean-empty { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="clean-header">
        <div class="clean-container clean-nav">
            <a class="clean-brand" href="index.html">
                <img src="storage/isc-kindu/logo.jpg" alt="ISC-KINDU">
                <span>ISC-KINDU</span>
            </a>
            <nav class="clean-links" aria-label="Navigation principale">
                <a href="index.html">Accueil</a>
                <a href="aboutus.html">Institution</a>
                <a href="services.html">Nos services</a>
                <a href="formation/licence.html">Formation</a>
                <a href="nos-frais.html">Nos frais</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>
    <main class="clean-main" data-backend-section="graduates">
        <section class="clean-container">
            <div class="clean-kicker">Scolarite</div>
            <h1 class="clean-title">Nos diplomes</h1>
            <p class="clean-lede">Aucune liste n'est disponible pour le moment.</p>
            <div class="clean-empty" aria-hidden="true">
                <article class="clean-card" data-backend-empty-block></article>
                <article class="clean-card" data-backend-empty-block></article>
            </div>
            <p class="clean-note">Les donnees valides seront affichees ici depuis le backend.</p>
        </section>
    </main>
    <footer class="clean-footer">
        <div class="clean-container">ISC-KINDU &copy; 2026 &middot; <a href="contact.html">Contact</a></div>
    </footer>
    <script src="js/isc-kindu.js"></script>
</body>
</html>
